# ── Vault root entity (singleton, id = "0") ─────────────────────────────────
type Vault @entity(immutable: false) {
  "Singleton entity, id is always the literal string \"0\"."
  id: String!

  # Contract identity / config
  contractAddress: Bytes!
  collateralToken: Bytes!
  marginEngine: Bytes!
  insuranceFundAddress: Bytes!
  "Keyless protocol backstop ledger that inherits liquidated positions (`BACKSTOP_ADDR`)."
  backstopAddress: Bytes!
  decimals: Int!

  # Lifetime stats
  totalDeposited: BigInt! # cumulative gross deposits (excludes insurance-fund deposits)
  totalWithdrawn: BigInt! # cumulative gross withdrawals (excludes insurance-fund withdrawals)
  insuranceFundDeposited: BigInt! # cumulative gross insurance-fund deposits
  insuranceFundWithdrawn: BigInt! # cumulative gross insurance-fund withdrawals
  totalSupply: BigInt! # current outstanding receipt tokens
  insuranceFundBalance: BigInt! # current INSURANCE_FUND_ADDR balance
  backstopBalance: BigInt! # current BACKSTOP_ADDR balance (receipt tokens; unfunded backstop sits at 0)
  backstopWithdrawn: BigInt! # cumulative `withdrawBackstop` sweeps
  totalUsers: Int! # number of distinct addresses with non-zero historical activity

  # Counters
  depositCount: Int!
  withdrawalCount: Int!
  internalTransferCount: Int!

  # Insurance-fund debt. Timing debt is expected; uncovered loss is a real loss.
  insuranceDebt: BigInt!
  insuranceDebtCap: BigInt!
  insuranceDebtBorrowedTotal: BigInt!
  insuranceDebtRepaidTotal: BigInt!
  traderBadDebtTotal: BigInt!
  "Share of traderBadDebtTotal whose payer was the protocol backstop (it is left unfunded, so its losses land here)."
  backstopBadDebtTotal: BigInt!
  "Backstop unwind band (bps around the mark) shared by every venue."
  backstopUnwindBandBps: Int!
  "Backstop unwind caller fee (bps of filled notional) shared by every venue."
  backstopUnwindFeeBps: Int!
  "Protocol capital: insurance deposits minus withdrawals. May be negative."
  insuranceCapital: BigInt!
  uncoveredLoss: BigInt!
  timingDebt: BigInt!
  halted: Boolean!
  "Block timestamp of the current halt. 0 when the vault is not halted."
  haltedSince: BigInt!
  "Block timestamp when the current debt opened. 0 when insuranceDebt is 0."
  insuranceDebtSince: BigInt!
  "Transaction of a Deposited log whose mint has not been seen yet. Empty when nothing is pending."
  pendingDepositTx: Bytes!
  "Recipient of that pending deposit."
  pendingDepositUser: Bytes!
  "Amount of that pending deposit."
  pendingDepositAmount: BigInt!

  # Timestamps
  initializedAt: BigInt!
  lastUpdatedAt: BigInt!
}

# ── Per-user account ────────────────────────────────────────────────────────
type VaultUser @entity(immutable: false) {
  id: Bytes! # user address
  address: Bytes!

  "Current receipt token balance (mirrors `vault.balanceOf(address)`)."
  balance: BigInt!

  "Cumulative gross collateral deposited by/for this user."
  totalDeposited: BigInt!
  "Cumulative gross collateral withdrawn by/for this user."
  totalWithdrawn: BigInt!

  "Signed net of internal transfers (received - sent)."
  netInternalIn: BigInt!
  "Signed net of internal transfers routed via the perps engine (received - sent)."
  netFromPerps: BigInt!
  "Signed net of internal transfers routed via the options engine (received - sent)."
  netFromOptions: BigInt!
  "Signed net of internal transfers routed via any other caller (received - sent)."
  netFromOther: BigInt!

  # Counters
  depositCount: Int!
  withdrawalCount: Int!

  # Relations
  deposits: [VaultDeposit!]! @derivedFrom(field: "user")
  withdrawals: [VaultWithdrawal!]! @derivedFrom(field: "user")
  internalTransfersIn: [VaultInternalTransfer!]! @derivedFrom(field: "to")
  internalTransfersOut: [VaultInternalTransfer!]! @derivedFrom(field: "from")
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "payer")

  # Timestamps
  createdAt: BigInt!
  lastActivityAt: BigInt!
}

# ── Deposit (`Deposited` event; covers `deposit`, `depositFor`, `depositForPermit`, `depositInsuranceFund`) ─
type VaultDeposit @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: VaultUser! # receipt-token recipient
  sender: Bytes! # account that supplied the underlying collateral (msg.sender)
  amount: BigInt!
  "True when this deposit credits the insurance-fund vanity address."
  isInsuranceFund: Boolean!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# ── Withdrawal (`Withdrawn` event; covers `withdraw`, `withdrawTo`, `withdrawInsuranceFund`) ─
type VaultWithdrawal @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  user: VaultUser! # account whose receipt tokens were burned
  recipient: Bytes! # who received the underlying collateral
  amount: BigInt!
  "True when this withdrawal debits the insurance-fund vanity address."
  isInsuranceFund: Boolean!
  "True when this withdrawal debits the protocol backstop ledger (`withdrawBackstop`)."
  isBackstop: Boolean!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# ── Internal transfer (`Transfer` event with from != 0x0 && to != 0x0) ──────
"""
Bucket for the calling contract that triggered an internal vault transfer.
Resolved from `transaction.to` against the perps/options addresses passed in via
the data source `context` (see subgraph.template.yaml).
"""
enum CallerCategory {
  PERPS
  OPTIONS
  OTHER
}

type VaultInternalTransfer @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  from: VaultUser!
  to: VaultUser!
  amount: BigInt!
  "Raw `transaction.to` (the contract whose function was called by the EOA)."
  caller: Bytes!
  "Bucketed `caller`: PERPS / OPTIONS / OTHER."
  callerCategory: CallerCategory!

  # Metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

enum BadDebtKind {
  RESERVE_LOSS
  FEE
}

enum InsuranceDebtKind {
  BORROW
  REPAY
}

enum HaltReason {
  CAP
  OWNER
  NO_MARGIN_ENGINE
}

enum VaultHaltKind {
  HALT
  RESUME
}

# One row per venue that has recorded a shortfall. `id` is the venue address.
type VaultVenue @entity(immutable: false) {
  id: Bytes!
  address: Bytes!
  "Shortfalls owed to the insurance fund. These increase uncovered loss."
  traderBadDebtTotal: BigInt!
  "Share of traderBadDebtTotal paid by the protocol backstop ledger."
  backstopBadDebtTotal: BigInt!
  "Fee shortfalls. Lost revenue; they do not increase uncovered loss."
  feeBadDebtTotal: BigInt!
  badDebts: [BadDebtEvent!]! @derivedFrom(field: "venue")
}

type BadDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  payer: VaultUser!
  receiver: Bytes!
  amount: BigInt!
  venue: VaultVenue!
  kind: BadDebtKind!
  "True when the payer is the protocol backstop ledger rather than a trader."
  isBackstop: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Derived from receipt Transfers. A user mint is a borrow unless the preceding
# Deposited log marked it as a deposit. A burn from the insurance fund is a
# repayment while debt is outstanding.
type InsuranceDebtEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  kind: InsuranceDebtKind!
  "Borrow recipient. Empty for a repayment."
  to: Bytes!
  amount: BigInt!
  debtAfter: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type BackstopParamsChange @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  unwindBandBps: Int!
  unwindFeeBps: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type InsuranceDebtCapChange @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  oldCap: BigInt!
  newCap: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type VaultHaltEvent @entity(immutable: true) {
  id: Bytes! # tx hash + log index
  kind: VaultHaltKind!
  "Set on HALT. Null on RESUME."
  reason: HaltReason
  debt: BigInt!
  effectiveCap: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}
