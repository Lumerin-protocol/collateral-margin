# yaml-language-server: $schema=../schemas/futures.json
# Titan Market Maker - Futures - PRODUCTION (base-mainnet).
#
#   PRIVATE_KEY             - hex private key of the production wallet (Secrets Manager)
#   ALCHEMY_API_KEY         - Alchemy API key (URL is composed below)
#   FUTURES_ADDRESS         - Futures address on base-mainnet (production deployment)
#   ETH_PRICE_FEED_ADDRESS  - Chainlink ETH/USD aggregator on base-mainnet

nodeEnv: production
commitHash: ${COMMIT_HASH:-unknown}
logLevel: ${MAKER_LOG_LEVEL:-info}
dryRun: ${MAKER_DRY_RUN:-false}
# Cancel resting orders on SIGINT/SIGTERM. Set false for hot-restart deploys
# where you'd rather absorb the brief stale-quote risk than pay cancel gas.
cancelOrdersOnShutdown: ${MAKER_CANCEL_ORDERS_ON_SHUTDOWN:-true}

wallets:
  primary:
    privateKey: ${PRIVATE_KEY}

network:
  name: base
  rpcUrl: https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
  ethPriceFeed: ${ETH_PRICE_FEED_ADDRESS:-}

venue:
  kind: futures
  address: ${FUTURES_ADDRESS}
  wallet: primary

pricing:
  strategy: reservation-price
  riskAversion: 0.001
  marginCallTimeSec: 3600
  minSpreadBps: 15
  volatilityMultiplier: 2.5
  maxSkewTicks: 0

sizing:
  strategy: geometric-taper
  baseQuantity: "500000000"           # venue-native (contracts base units)
  numLevelsPerSide: 4
  taperRatio: 0.6

risk:
  maxPositionSize: 1000
  maxUtilizationPct: 75
  minCollateralBalance: 100
  maxDailyLossUsd: 1000
  maxGasBudgetPerHourUsd: 50
  maxGasBudgetPerDayUsd: 500
  gasSpikeThresholdPct: 200
  gasPenaltyBps: 5
  urgentRequoteThresholdTicks: 10

gas:
  gasCapMultiplier: 2.0

timing:
  pollIntervalSec: 3
  requoteThresholdTicks: 2
  requoteCooldownSec: 1
  resyncIntervalSec: 60
  levelSpacingTicks: 1

collateral:
  autoDeposit: true
  autoDepositMinAmount: 1

health:
  port: ${MAKER_HEALTH_PORT:-3001}
