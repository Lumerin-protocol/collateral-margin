# yaml-language-server: $schema=../schemas/perps.json
# Titan Market Maker - Perps - LOCAL (hardhat).
#
# Local development against a hardhat node. Dry-run on by default,
# debug logs, tiny sizes. Override via env vars (loaded from
# market-maker/.env or collateral-margin/.env on startup, in that
# priority order).
#
#   PRIVATE_KEY             - hex private key of the market-making wallet
#   PERPS_ADDRESS           - HashPowerPerpsDEX address on the local chain

nodeEnv: development
commitHash: ${COMMIT_HASH:-dev}
logLevel: ${MAKER_LOG_LEVEL:-debug}
dryRun: ${MAKER_DRY_RUN:-true}
# Local/dev iterates fast; leave resting orders on the hardhat book on Ctrl-C
# so you don't pay the cancel-then-reopen round-trip on every restart.
cancelOrdersOnShutdown: false

wallets:
  primary:
    privateKey: ${PRIVATE_KEY}

network:
  name: ${NETWORK:-hardhat}
  rpcUrl: http://127.0.0.1:8545
  ethPriceFeed: ${ETH_PRICE_FEED_ADDRESS:-}

venue:
  kind: perps
  address: ${PERPS_ADDRESS}
  wallet: primary

pricing:
  strategy: effective-spread
  minSpreadBps: 20 # wider in dev so test fills are obvious
  volatilityMultiplier: 2.0
  inventorySkewGamma: 0.5
  maxSkewTicks: 20

sizing:
  strategy: geometric-taper
  baseQuantity: "100000" # venue-native units (hashrate base)
  numLevelsPerSide: 10
  taperRatio: 0.6

risk:
  # All *Usd fields are USD (decimals OK). Loader converts to 6-dec USDC.
  maxPositionSize: 10
  maxUtilizationPct: 80
  minCollateralBalance: 1
  maxDailyLossUsd: 100
  maxGasBudgetPerHourUsd: 50
  maxGasBudgetPerDayUsd: 500
  gasSpikeThresholdPct: 200
  gasPenaltyBps: 5
  urgentRequoteThresholdTicks: 10

gas:
  gasCapMultiplier: 2.0

timing:
  # All *Sec fields are seconds (decimals OK). Loader converts to ms.
  pollIntervalSec: 3
  requoteCooldownSec: 1
  resyncIntervalSec: 60
  levelSpacingTicks: 5
  staleBandAllowanceUsd: 0.03
  staleSizeAllowanceUsd: 50

collateral:
  # Off in dev so you can inspect un-deposited wallet balance.
  autoDeposit: false
  autoDepositMinAmount: 0

oracle:
  # No `history:` block → cold start, σ warms up live as the local oracle
  # ticks (likely never on hardhat unless you script price updates).
  windowSize: 60
  precisionBits: 48
  historyLookbackMultiplier: 4

health:
  port: ${MAKER_HEALTH_PORT:-3001}

readBatchSize: 100
# Per-operation batch sizes for writes.
writeBatchSize: 100
