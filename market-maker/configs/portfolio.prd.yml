# yaml-language-server: $schema=../schemas/portfolio.json
# Titan Market Maker - Portfolio (perps + all futures expiries) - PRODUCTION (base-mainnet).
#
#   PRIVATE_KEY                       - hex private key of the production wallet (Secrets Manager)
#   ALCHEMY_API_KEY                   - Alchemy API key (URL is composed below)
#   PERPS_ADDRESS                     - HashPowerPerpsDEX address on base-mainnet (production deployment)
#   FUTURES_ADDRESS                   - Futures address on base-mainnet (production deployment)
#   ETH_PRICE_FEED_ADDRESS            - Chainlink ETH/USD aggregator on base-mainnet
#   HASHPRICE_ORACLE_SUBGRAPH_URL     - hashprice-oracle subgraph URL for σ backfill at startup

nodeEnv: production
commitHash: ${COMMIT_HASH:-unknown}
logLevel: ${MAKER_LOG_LEVEL:-info}
dryRun: ${MAKER_DRY_RUN:-false}
cancelOrdersOnShutdown: ${MAKER_CANCEL_ORDERS_ON_SHUTDOWN:-true}

wallets:
  primary:
    privateKey: ${PRIVATE_KEY}

wallet: primary

network:
  name: base
  rpcUrl: https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
  ethPriceFeed: ${ETH_PRICE_FEED_ADDRESS:-}

venues:
  - kind: perps
    address: ${PERPS_ADDRESS}
    maxPositionSize: 1000
    pricing:
      strategy: effective-spread
      minSpreadBps: 10
      volatilityMultiplier: 2.0
      inventorySkewGamma: 0.5
      maxSkewTicks: 20
    sizing:
      strategy: geometric-taper
      baseQuantity: "10000000"
      numLevelsPerSide: 10
      taperRatio: 0.6

  - kind: futures
    address: ${FUTURES_ADDRESS}
    maxPositionSize: 1000
    marketSelection:
      mode: nearest
      count: 3
    pricing:
      strategy: reservation-price
      riskAversion: 0.001
      marginCallTimeSec: 3600
      minSpreadBps: 15
      volatilityMultiplier: 2.5
      maxSkewTicks: 0
    sizing:
      strategy: geometric-taper
      # Perps runs 100/side here, so 4 × 10 × 3 expiries = 120 is the nearest
      # match; base 4 also keeps the taper's last level non-zero.
      baseQuantity: 4
      numLevelsPerSide: 10
      taperRatio: 0.6
      expirySizeDecay: 0.6

risk:
  maxPositionSize: 1000
  maxUtilizationPct: 75
  minCollateralBalance: 100
  maxDailyLossUsd: 1000
  maxGasBudgetPerHourUsd: 50
  maxGasBudgetPerDayUsd: 500
  gasSpikeThresholdPct: 200
  gasPenaltyBps: 5
  urgentRequoteThresholdTicks: 10

gas:
  gasCapMultiplier: 2.0

timing:
  pollIntervalSec: 3
  requoteCooldownSec: 1
  resyncIntervalSec: 60
  levelSpacingTicks: 1
  staleBandAllowanceUsd: 0.03
  staleSizeAllowanceUsd: 50

collateral:
  autoDeposit: true
  autoDepositMinAmount: 1
  maxCollateralAmount: 10000

oracle:
  windowSize: 60
  precisionBits: 48
  historyMaxAgeSec: 86400
  history:
    subgraphUrl: ${HASHPRICE_ORACLE_SUBGRAPH_URL}

health:
  port: ${MAKER_HEALTH_PORT:-3001}

txCoordinator:
  confirmationTimeoutSec: 60
  maxReplacements: 2
  replacementFeeBumpPct: 15
  maxNonceResyncs: 5

circuitBreaker:
  quarantineThreshold: 3
  baseBackoffSec: 5
  maxBackoffSec: 180

rollCheckIntervalSec: 300
sharedStalenessGraceSec: 30

readBatchSize: 100
writeBatchSize: 100
