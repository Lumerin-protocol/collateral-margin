# yaml-language-server: $schema=../schemas/futures.json
# Titan Market Maker - Futures - DEV (base-sepolia).
#
#   PRIVATE_KEY             - hex private key of the dev market-making wallet
#   ETH_NODE_ADDRESS        - base-sepolia JSON-RPC endpoint
#   FUTURES_ADDRESS         - Futures address on base-sepolia
#   ETH_PRICE_FEED_ADDRESS  - optional Chainlink ETH/USD aggregator on base-sepolia

nodeEnv: development
commitHash: ${COMMIT_HASH:-unknown}
logLevel: ${MAKER_LOG_LEVEL:-debug}
dryRun: ${MAKER_DRY_RUN:-false}

wallets:
  primary:
    privateKey: ${PRIVATE_KEY}

network:
  name: base-sepolia
  rpcUrl: ${ETH_NODE_ADDRESS}
  ethPriceFeed: ${ETH_PRICE_FEED_ADDRESS:-}

venue:
  kind: futures
  address: ${FUTURES_ADDRESS}
  wallet: primary

pricing:
  strategy: reservation-price
  riskAversion: 0.001
  marginCallTimeSeconds: 3600
  minSpreadBps: 15
  volatilityMultiplier: 2.5
  maxSkewTicks: 0

sizing:
  strategy: geometric-taper
  baseQuantity: "100000000"       # 100 USDC per side total
  numLevelsPerSide: 4
  taperRatio: 0.6

risk:
  maxPositionSize: "50000000"
  maxUtilizationPct: 80
  minCollateralBalance: "10000000"
  maxDailyLossUsd: "500000000"
  maxGasBudgetPerHourUsd: "50000000"
  maxGasBudgetPerDayUsd: "500000000"
  gasSpikeThresholdPct: 200
  gasPenaltyBps: 5
  urgentRequoteThresholdTicks: 10

gas:
  gasCapMultiplier: 2.0

timing:
  pollIntervalMs: 3000
  requoteThresholdTicks: 2
  requoteCooldownMs: 1000
  resyncIntervalMs: 60000
  levelSpacingTicks: 1

collateral:
  autoDeposit: true
  autoDepositMinAmount: "1000000"

health:
  port: ${MAKER_HEALTH_PORT:-3001}
