name: Keeper Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  pull_request:
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  workflow_dispatch:

concurrency:
  group: keeper-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout collateral-margin
        uses: actions/checkout@v6
        with:
          path: collateral-margin

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: collateral-margin/keeper/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: collateral-margin/keeper/pnpm-lock.yaml

      - name: Install keeper dependencies
        working-directory: collateral-margin/keeper
        run: pnpm install --frozen-lockfile

      - name: TypeCheck
        working-directory: collateral-margin/keeper
        run: pnpm typecheck

      - name: Unit tests
        working-directory: collateral-margin/keeper
        run: pnpm test

      - name: Install contracts dependencies
        working-directory: collateral-margin/contracts
        run: pnpm install --frozen-lockfile

      - name: Checkout perps
        uses: actions/checkout@v6
        with:
          repository: Lumerin-protocol/derivatives-marketplace
          ref: dev
          path: perps

      - name: Checkout futures-marketplace
        uses: actions/checkout@v6
        with:
          repository: Lumerin-protocol/futures-marketplace
          ref: dev

      - name: List folders
        run: find . -maxdepth 3 -type d | sort | head -50

      - name: Install perps contracts dependencies
        working-directory: perps/contracts
        run: pnpm install --frozen-lockfile

      - name: Install futures contracts dependencies
        working-directory: futures-marketplace/contracts
        run: pnpm install --frozen-lockfile

      - name: Compile siblings
        working-directory: collateral-margin/keeper
        run: pnpm pretest:integration

      - name: Integration tests
        working-directory: collateral-margin/keeper
        run: pnpm test:integration
