name: Keeper Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  pull_request:
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  workflow_dispatch:

concurrency:
  group: keeper-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collateral-margin
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: keeper/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: keeper/pnpm-lock.yaml

      - name: Install keeper dependencies
        working-directory: ./keeper
        run: pnpm install --frozen-lockfile

      # pnpm git path deps must keep `path: /contracts/abi` in the lockfile
      # resolution. If that field is dropped (integrity-only), a cold CI store
      # unpacks the whole futures-marketplace repo and TypeCheck fails with
      # TS2307 on futures-marketplace-abi/Futures.ts.
      - name: Verify futures ABI package layout
        working-directory: ./keeper
        run: |
          set -euo pipefail
          pkg="node_modules/futures-marketplace-abi"
          test -f "$pkg/Futures.ts"
          test -f "$pkg/package.json"
          if grep -q '_pnpmPlaceholder' "$pkg/package.json"; then
            echo "::error::$pkg/package.json is a pnpm placeholder; lockfile likely lost path:/contracts/abi"
            exit 1
          fi
          if ! grep -q '"name": "futures-marketplace-abi"' "$pkg/package.json"; then
            echo "::error::$pkg/package.json is not the abi package manifest"
            cat "$pkg/package.json"
            exit 1
          fi
          echo "futures-marketplace-abi layout ok:"
          ls -la "$pkg" | head -20

      - name: TypeCheck
        working-directory: ./keeper
        run: pnpm typecheck

      - name: Unit tests
        working-directory: ./keeper
        run: pnpm test

      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      - name: Checkout derivatives-marketplace (perps contracts)
        uses: actions/checkout@v5
        with:
          repository: Lumerin-protocol/derivatives-marketplace
          ref: c8078b9e430df8a5ec8bc64865d692b38cc69d8c
          path: perps

      - name: Checkout futures-marketplace
        uses: actions/checkout@v5
        with:
          repository: Lumerin-protocol/futures-marketplace
          # Futures 3.0 aggregate positions (PR Lumerin-protocol/futures-marketplace#215).
          # After that merges to dev, retarget this pin to the merge commit / dev tip.
          ref: 2e2c1b599eec37f2f27973e78bafaf0870e1df7a
          path: futures-marketplace

      - name: Install perps contracts dependencies
        working-directory: perps/contracts
        run: pnpm install --frozen-lockfile

      - name: Install futures contracts dependencies
        working-directory: futures-marketplace/contracts
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        working-directory: ./keeper
        env:
          PERPS_REPO: ${{ github.workspace }}/perps
          FUTURES_REPO: ${{ github.workspace }}/futures-marketplace
        run: pnpm test:integration
