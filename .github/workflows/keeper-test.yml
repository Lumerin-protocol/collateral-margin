name: Keeper Tests

on:
  push:
    branches: [main, dev, stg]
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  pull_request:
    paths:
      - "keeper/**"
      - ".github/workflows/keeper-test.yml"

  workflow_dispatch:

concurrency:
  group: keeper-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collateral-margin
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: keeper/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: keeper/pnpm-lock.yaml

      - name: Install keeper dependencies
        working-directory: ./keeper
        run: pnpm install --frozen-lockfile

      - name: TypeCheck
        working-directory: ./keeper
        run: pnpm typecheck

      - name: Unit tests
        working-directory: ./keeper
        run: pnpm test

      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      # TEMPORARY: pinned to feat/liquidate-to-im-buffer because the keeper's
      # liquidate-to-IM-buffer orchestration calls contract functions
      # (`liquidatePositions` on futures, `liquidatePosition(user, closeQty)` on
      # perps) that only exist on those feature branches. Revert both refs back
      # to `dev` once derivatives-marketplace#73 and futures-marketplace#203 merge.
      - name: Checkout derivatives-marketplace (perps contracts)
        uses: actions/checkout@v5
        with:
          repository: Lumerin-protocol/derivatives-marketplace
          ref: feat/liquidate-to-im-buffer
          path: perps

      - name: Checkout futures-marketplace
        uses: actions/checkout@v5
        with:
          repository: Lumerin-protocol/futures-marketplace
          ref: feat/liquidate-to-im-buffer
          path: futures-marketplace

      - name: Install perps contracts dependencies
        working-directory: perps/contracts
        run: pnpm install --frozen-lockfile

      - name: Install futures contracts dependencies
        working-directory: futures-marketplace/contracts
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        working-directory: ./keeper
        env:
          PERPS_REPO: ${{ github.workspace }}/perps
          FUTURES_REPO: ${{ github.workspace }}/futures-marketplace
        run: pnpm test:integration
