name: Deploy Collateral Margin Market Maker

# CI/CD owns the "personality" of the single portfolio market-maker ECS
# service. One process quotes perps AND every selected futures expiry on one
# shared signer/collateral vault, so we run it on a single ECS service. We
# reuse the futures service scaffolding (svc/tsk-col-mar-futures-mm) that
# Terraform provisions; the perps service is no longer deployed to.
# Terraform builds the scaffolding (service shell, ALB, target group, log
# group, security groups, Route53, IAM); this workflow:
#
#   1. Builds one Docker image from market-maker/ and pushes to GHCR
#   2. Renders a new task-def revision for the portfolio app (MAKER_APP=portfolio)
#      with image + public config from config/<env>.env. PRIVATE_KEY and
#      ALCHEMY_API_KEY are injected by ECS from Secrets Manager (valueFrom).
#   3. Calls ecs:UpdateService to point the service at the new revision
#      and to scale it to the operator-chosen desired_count
#
# Container config (contract addresses, log level, oracle URL, …) is NOT
# declared here. It comes from config/dev.env and config/prd.env, the same
# files the market-maker loads locally, and every key in the chosen file is
# passed to the task definition. To add or change one, edit that file.
#
# GitHub Variables (configure per-environment under Settings -> Environments):
#   MAKER_DESIRED_COUNT               default "1" (set 0 to halt without
#                                     redeploy) — deploy orchestration, not
#                                     container config
#
# GitHub Secrets (configure per-environment):
#   AWS_ROLE_ARN_DEV / _LMN           OIDC role ARNs from the TF output github_actions_role_arn
#   SLACK_WEBHOOK_URL                 (org or repo level) for slack-notify
# Signer and Alchemy keys live in Secrets Manager
# (`col-mar-futures-mm-secrets-v3-<dev|lmn>`), seeded from secret.auto.tfvars.

on:
  push:
    branches:
      - dev
      - main
      - "cicd/**"
    paths:
      - "market-maker/**"
      - "config/*.env"
      - ".github/workflows/deploy-col-mar-mm.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - main

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating git tags on main
  packages: write # For GHCR

env:
  COMPONENT: col-mar-mm
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/lumerin-protocol/collateral-margin-market-maker

jobs:
  config-scope:
    name: Config scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip the other environment's config
        id: gate
        run: |
          # dev does not deploy when the only change is config/prd.env.
          # main does not deploy when the only change is config/dev.env.
          # Any other file still deploys. A manual run always deploys.
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$REF"
            FILES=$(git diff --name-only "origin/${REF}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP="config/prd.env"
          [ "$REF" = "main" ] && SKIP="config/dev.env"
          RUN=true
          if [ -n "$FILES" ] && [ -z "$(printf '%s\n' "$FILES" | grep -vx "$SKIP" || true)" ]; then
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF skip=$SKIP run=$RUN"
          printf '%s\n' "$FILES"

  build:
    name: 🔨 Build
    needs: config-scope
    if: needs.config-scope.result == 'success' && needs.config-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen_tag.outputs.version }}
      tag: ${{ steps.gen_tag.outputs.tag_name }}
      environment: ${{ steps.gen_tag.outputs.environment }}
      maker_env: ${{ steps.env_config.outputs.maker_env }}
      env_suffix: ${{ steps.env_config.outputs.env_suffix }}
      aws_region: ${{ steps.env_config.outputs.aws_region }}
      ecs_cluster: ${{ steps.env_config.outputs.ecs_cluster }}
      service: ${{ steps.env_config.outputs.service }}
      task_family: ${{ steps.env_config.outputs.task_family }}
      health_url: ${{ steps.env_config.outputs.health_url }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: col-mar-mm
          major_version: "1"
          environment_override: ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.environment || '' }}

      - name: Environment config
        id: env_config
        run: |
          ENV="${{ steps.gen_tag.outputs.environment }}"
          echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
          # The unified portfolio MM runs on the futures service scaffolding.
          echo "task_family=tsk-col-mar-futures-mm" >> $GITHUB_OUTPUT

          # URL_HOST_PREFIX matches the per-env Route53 alias produced by the
          # collateral-margin TF stack (futures_mm_endpoint in 00_outputs.tf):
          # dev gets a subdomain, prod uses the apex.
          #
          # MAKER_ENV also selects both the YAML profile baked into the image
          # and the config/<name>.env read at deploy time.
          case "$ENV" in
            dev)
              SUFFIX="dev"
              MAKER_ENV="dev"
              URL_HOST_PREFIX="dev."
              ;;
            main)
              SUFFIX="lmn"
              MAKER_ENV="prd"
              URL_HOST_PREFIX=""
              ;;
            *)
              echo "::error::Unknown environment '$ENV' (expected dev or main)"
              exit 1
              ;;
          esac

          echo "env_suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "maker_env=${MAKER_ENV}" >> $GITHUB_OUTPUT
          echo "ecs_cluster=ecs-derivatives-marketplace-${SUFFIX}" >> $GITHUB_OUTPUT
          echo "service=svc-col-mar-futures-mm-${SUFFIX}" >> $GITHUB_OUTPUT
          echo "health_url=https://futuresmm.${URL_HOST_PREFIX}hashpower.exchange/health" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: docker_tags
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:${{ steps.gen_tag.outputs.version }}
          ${{ env.GHCR_IMAGE }}:${{ steps.gen_tag.outputs.environment }}-latest"

          if [ "${{ steps.gen_tag.outputs.environment }}" == "main" ]; then
            TAGS="${TAGS}
          ${{ env.GHCR_IMAGE }}:latest"
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./market-maker
          push: ${{ steps.gen_tag.outputs.is_cicd_branch != 'true' }}
          load: ${{ steps.gen_tag.outputs.is_cicd_branch == 'true' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.gen_tag.outputs.version }}

      - name: CI/CD test summary
        if: steps.gen_tag.outputs.is_cicd_branch == 'true'
        run: |
          echo "## 🔧 CI/CD Test Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Test only (no deployment)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gen_tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** Built locally, not pushed to GHCR" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy portfolio
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_cicd_branch != 'true'
    environment: ${{ needs.build.outputs.environment }}

    steps:
      # Needed for config/<env>.env, which supplies the container environment.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' &&
            secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-ColMarMM-portfolio-${{ github.run_id }}

      - name: Verify service exists
        id: svc_check
        env:
          SERVICE: ${{ needs.build.outputs.service }}
          CLUSTER: ${{ needs.build.outputs.ecs_cluster }}
          REGION: ${{ needs.build.outputs.aws_region }}
        run: |
          ACTIVE_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION" \
            --query 'services[?status==`ACTIVE`] | length(@)' \
            --output text 2>/dev/null || echo "0")

          if [ "$ACTIVE_COUNT" = "0" ]; then
            echo "⚠️ ECS service '$SERVICE' is not ACTIVE in cluster '$CLUSTER'."
            echo "    Likely Terraform has create=false for this service. Skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Service '$SERVICE' is active. Proceeding with deploy."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Render new task definition + deploy
        if: steps.svc_check.outputs.skip != 'true'
        env:
          # Routing
          CLUSTER: ${{ needs.build.outputs.ecs_cluster }}
          SERVICE: ${{ needs.build.outputs.service }}
          TASK_FAMILY: ${{ needs.build.outputs.task_family }}
          REGION: ${{ needs.build.outputs.aws_region }}
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.version }}
          ENV_SUFFIX: ${{ needs.build.outputs.env_suffix }}

          # Deploy orchestration (not container config)
          MAKER_DESIRED_COUNT: ${{ vars.MAKER_DESIRED_COUNT }}

          # Computed. Signer and Alchemy come from Secrets Manager.
          MAKER_APP: portfolio
          MAKER_ENV: ${{ needs.build.outputs.maker_env }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONFIG="config/${MAKER_ENV}.env"
          DESIRED_COUNT="${MAKER_DESIRED_COUNT:-1}"

          echo "🚀 Deploying portfolio to ${{ needs.build.outputs.environment }}"
          echo "   Cluster: ${CLUSTER}"
          echo "   Service: ${SERVICE}"
          echo "   Task Family: ${TASK_FAMILY}"
          echo "   Image: ${IMAGE}"
          echo "   MAKER_ENV: ${MAKER_ENV}"
          echo "   Config: ${CONFIG}"
          echo "   Desired Count: ${DESIRED_COUNT}"

          # Fetch current task def, strip non-registerable metadata, swap image
          echo "📥 Fetching current task definition..."
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --region "${REGION}" \
            --query 'taskDefinition' > task-def.json

          echo "🔧 Updating container image..."
          jq --arg IMAGE "${IMAGE}" '
            .containerDefinitions[0].image = $IMAGE |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json

          # Public keys from config/<env>.env plus values computed by this run.
          # Secret names are stripped so they cannot land in the environment block.
          echo "🔧 Injecting environment from ${CONFIG}..."
          set -a && . "$CONFIG" && set +a

          KEYS=$( { sed -n 's/^[[:space:]]*\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$CONFIG"; \
                    printf '%s\n' MAKER_APP MAKER_ENV COMMIT_HASH; } \
                  | grep -vxE 'ALCHEMY_API_KEY|LIQUIDATOR_PRIVATE_KEY|WEBHOOK_SECRET|PRIVATE_KEY|FUTURES_MM_PRIVATE_KEY|PERPS_MM_PRIVATE_KEY' || true )

          # Empty values are dropped so the maker applies its own defaults
          # instead of parsing an empty string.
          jq -n --arg keys "$KEYS" '[
            $keys
            | split("\n")
            | unique
            | .[]
            | select(. != "" and ($ENV[.] // "") != "")
            | {name: ., value: $ENV[.]}
          ]' > env-block.json

          echo "   Container env keys: $(jq -r '[.[].name] | join(", ")' env-block.json)"

          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "col-mar-futures-mm-secrets-v3-${ENV_SUFFIX}" \
            --region "${REGION}" \
            --query ARN --output text)
          echo "   Secrets from: col-mar-futures-mm-secrets-v3-${ENV_SUFFIX}"

          jq --slurpfile env env-block.json --arg arn "$SECRET_ARN" '
            .containerDefinitions[0].environment = $env[0] |
            .containerDefinitions[0].secrets = [
              {"name":"PRIVATE_KEY","valueFrom":($arn + ":private_key::")},
              {"name":"ALCHEMY_API_KEY","valueFrom":($arn + ":alchemy_api_key::")}
            ]
          ' new-task-def.json > final-task-def.json
          mv final-task-def.json new-task-def.json

          # Register new revision
          echo "📝 Registering new task definition revision..."
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --region "${REGION}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Registered: ${NEW_TASK_DEF}"

          # Update ECS service to point at the new revision and the desired count
          echo "🚀 Updating ECS service..."
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${NEW_TASK_DEF}" \
            --desired-count "${DESIRED_COUNT}" \
            --region "${REGION}" \
            --force-new-deployment > /dev/null

          echo "✅ Deployment triggered for portfolio"

  verify:
    name: 🔍 Verify portfolio
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: needs.build.outputs.is_cicd_branch != 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' &&
            secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-ColMarMM-portfolio-Verify-${{ github.run_id }}

      - name: Wait for service to stabilize
        env:
          SERVICE: ${{ needs.build.outputs.service }}
          CLUSTER: ${{ needs.build.outputs.ecs_cluster }}
          REGION: ${{ needs.build.outputs.aws_region }}
        run: |
          ACTIVE=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION" \
            --query 'services[?status==`ACTIVE`] | length(@)' \
            --output text 2>/dev/null || echo "0")
          if [ "$ACTIVE" = "0" ]; then
            echo "⚠️ Service $SERVICE not active — nothing to verify."
            exit 0
          fi

          echo "⏳ Waiting for $SERVICE to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION"
          echo "✅ Stable."

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [ build, verify ]
    if: always() && needs.build.result != 'skipped' && needs.build.outputs.is_cicd_branch != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        if: needs.verify.result == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: needs.verify.result == 'success'
        run: |
          TAG_NAME="${{ needs.build.outputs.tag }}"
          echo "🏷️  Creating tag: $TAG_NAME"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping"
          else
            git tag -a "$TAG_NAME" -m "Release ${{ needs.build.outputs.version }} - Deployed to ${{ needs.build.outputs.environment }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag pushed"
          fi

      - name: Deployment summary
        if: needs.verify.result == 'success'
        run: |
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Collateral Margin Market Maker (portfolio: perps + futures)" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ needs.build.outputs.ecs_cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ needs.build.outputs.service }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: needs.verify.result == 'failure'
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Collateral Margin Market Maker" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Check logs above for details." >> $GITHUB_STEP_SUMMARY

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [ build, deploy, verify, cleanup ]
    if: always() && (needs.build.result == 'success')

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.build.outputs.is_cicd_branch }}" == "true" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.build.outputs.environment }}
          service_name: "Collateral Margin Market Maker"
          version: ${{ needs.build.outputs.version }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          image_tag: ${{ needs.build.outputs.is_cicd_branch != 'true' && format('{0}:{1}',
            env.GHCR_IMAGE, needs.build.outputs.version) || '' }}
          additional_info: "${{ needs.build.outputs.is_cicd_branch == 'true' && '*Mode:*
            CI/CD Test (build only, no deploy)' || format('*Health:* <{0}|Portfolio>

            *Cluster:* `{1}` • *Service:* `{2}`',
            needs.build.outputs.health_url,
            needs.build.outputs.ecs_cluster, needs.build.outputs.service) }}"
