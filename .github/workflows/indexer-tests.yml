name: Indexer tests

on:
  pull_request:
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/indexer-tests.yml"
  push:
    branches:
      - main
      - stg
      - dev
    paths:
      - "indexer/**"
      - "contracts/**"
      - ".github/workflows/indexer-tests.yml"

jobs:
  pre:
    name: Skip duplicate runs
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}
    steps:
      - id: skip-check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: never
          skip_after_successful_duplicate: "true"
          paths_ignore: '["**/*.md"]'

  test:
    name: Indexer tests
    needs: pre
    if: needs.pre.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: indexer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            indexer/pnpm-lock.yaml
            contracts/pnpm-lock.yaml

      # Integration tests deploy the vault from compiled artifacts.
      - name: Install contracts dependencies
        working-directory: ./contracts
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        working-directory: ./contracts
        run: pnpm compile

      - name: Install indexer dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      # Render subgraph.yaml from the template using the dummy values shipped
      # in .env.example so codegen has something to chew on. Real addresses
      # are only needed at deploy time.
      - name: Prepare subgraph (with .env.example defaults)
        working-directory: ./indexer
        run: |
          ENV_FILE=.env.example pnpm prepare:env
          echo "--- subgraph.yaml ---"
          cat subgraph.yaml

      - name: Codegen
        working-directory: ./indexer
        run: pnpm codegen

      - name: Lint
        working-directory: ./indexer
        run: pnpm lint

      - name: Typecheck
        working-directory: ./indexer
        run: pnpm typecheck

      - name: Run matchstick unit tests
        working-directory: ./indexer
        run: pnpm test

      - name: Run integration tests
        working-directory: ./indexer
        run: pnpm test:integration
