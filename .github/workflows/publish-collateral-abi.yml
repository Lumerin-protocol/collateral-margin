name: Publish @hashpower/collateral-abi

# Publishes the ABI package to npm. `dev` writes environments.testnet from
# config/dev.env, keeps the mainnet block from the `latest` tag, publishes
# on the npm dist-tag `dev`, and bumps the minor. `main` writes
# environments.mainnet from config/prd.env, keeps the testnet block from
# the `dev` tag, and publishes on `latest`. The first mainnet cut is
# 1.0.0; later mainnet address changes are patches, and an ABI break on
# main bumps the major. Nothing is committed back — the branch is
# protected — so the version of record lives on npm and each release is
# marked with a git tag (collateral-abi-vX.Y.Z) on the source commit.
#
# Auth uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# NOTE: the very first release must be published manually
# (`cd collateral-abi && pnpm build && npm publish --access public`),
# then configure this repo+workflow as a Trusted Publisher in the
# package settings on npmjs.com. CI handles every release after that.

on:
  push:
    branches:
      # `dev` = testnet npm bumps. `main` is already allowed so a
      # dev→main promotion does not need a workflow edit. GitHub
      # environment `npm-publish` must permit both branches.
      - dev
      - main
    paths:
      - "contracts/abi/**"
      - "config/dev.env"
      - "config/prd.env"
      - "collateral-abi/**"
      - ".github/workflows/publish-collateral-abi.yml"
  # Manual runs from any branch for testing the pipeline. `version` publishes
  # exactly that version, skipping the ABI diff (one-time resets / recovery).
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (skips semver diff)"
        required: false
        default: ""

permissions:
  contents: write # push release tags
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-collateral-abi
  cancel-in-progress: false

jobs:
  publish:
    name: 📦 Build & publish to npm
    runs-on: ubuntu-latest
    # Must match the Trusted Publisher environment configured on npmjs.com
    environment: npm-publish
    defaults:
      run:
        working-directory: ./collateral-abi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: collateral-abi/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No pnpm cache. setup-node's post step fails the whole job with
          # "Path Validation Error" when the store path it recorded is gone,
          # including after a skipped publish. This package has one
          # devDependency, so the cache is not worth a red release.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Compose deployments manifest
        env:
          CHANNEL: ${{ github.ref_name }}
        run: node scripts/compose-deployments.mjs

      - name: Compute version and dist-tag
        id: bump
        env:
          CHANNEL: ${{ github.ref_name }}
          FORCED_VERSION: ${{ inputs.version || '' }}
        run: node scripts/plan-release.mjs

      - name: Publish
        if: steps.bump.outputs.level != 'none'
        # `dev` publishes must not move `latest`. A forced version follows
        # the same dist-tag as the branch it was dispatched from.
        run: npm publish --access public --provenance --tag ${{ steps.bump.outputs.dist_tag }}

      - name: Tag release
        if: steps.bump.outputs.level != 'none'
        continue-on-error: true # traceability only — never blocks a publish
        run: |
          TAG="collateral-abi-v${{ steps.bump.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Trigger hashpower.io rebuild
        if: steps.bump.outputs.level != 'none'
        continue-on-error: true # site refresh is best-effort — never blocks a publish
        env:
          DISPATCH_TOKEN: ${{ secrets.HASHPOWER_IO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::HASHPOWER_IO_DISPATCH_TOKEN is not set — hashpower.io will not auto-refresh /deployments.json and /build. Add a fine-grained PAT (hashpower-io repo, Contents: read/write) as an org or repo secret."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Lumerin-protocol/hashpower-io/dispatches \
            -d "{\"event_type\":\"abi-published\",\"client_payload\":{\"package\":\"@hashpower/collateral-abi\",\"version\":\"${{ steps.bump.outputs.version }}\",\"source_ref\":\"${{ github.ref_name }}\"}}"
          echo "Dispatched abi-published to Lumerin-protocol/hashpower-io"

      - name: Trigger hashpower-mcp ABI bump PR
        if: steps.bump.outputs.level != 'none'
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.HASHPOWER_MCP_DISPATCH_TOKEN || secrets.HASHPOWER_IO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::No dispatch token for hashpower-mcp — add HASHPOWER_MCP_DISPATCH_TOKEN (or expand HASHPOWER_IO_DISPATCH_TOKEN to include that repo)."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Lumerin-protocol/hashpower-mcp/dispatches \
            -d "{\"event_type\":\"abi-published\",\"client_payload\":{\"package\":\"@hashpower/collateral-abi\",\"version\":\"${{ steps.bump.outputs.version }}\",\"source_ref\":\"${{ github.ref_name }}\"}}"
          echo "Dispatched abi-published to Lumerin-protocol/hashpower-mcp"

      - name: Summary
        if: steps.bump.outputs.level != 'none'
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "## 📦 Published $PKG@$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://www.npmjs.com/package/$PKG/v/$VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification
        if: always() && steps.bump.outputs.level != 'none' && steps.bump.outputs.level != ''
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ job.status }}
          environment: "npm"
          service_name: "@hashpower/collateral-abi"
          version: ${{ steps.bump.outputs.version || 'unknown' }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ format('*Semver bump:* `{0}` • *Package:* <https://www.npmjs.com/package/@hashpower/collateral-abi/v/{1}|@hashpower/collateral-abi@{1}>', steps.bump.outputs.level, steps.bump.outputs.version) }}"
